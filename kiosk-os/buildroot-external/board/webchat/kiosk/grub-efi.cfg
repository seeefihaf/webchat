set default=0
set timeout=2

menuentry "Webchat Kiosk OS" {
    linux /boot/bzImage root=PARTLABEL=rootfs rootfstype=squashfs ro quiet splash kiosk=1
}

menuentry "Webchat Kiosk OS (RAM-only profile)" {
    linux /boot/bzImage root=PARTLABEL=rootfs rootfstype=squashfs ro quiet splash kiosk=1 copytoram=1
}
