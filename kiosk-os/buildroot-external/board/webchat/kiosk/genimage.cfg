image efi-part.vfat {
  vfat {
    label = "EFI"
    files = {
      "efi-boot/"
    }
  }
  size = 128M
}

image webchat-kiosk.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition boot {
    image = "efi-part.vfat"
    partition-type-uuid = U
    bootable = "true"
  }

  partition rootfs {
    image = "rootfs.squashfs"
    partition-type-uuid = L
    readonly = "true"
  }

  partition persist {
    partition-type-uuid = L
    size = 1024M
    filesystem = "ext4"
    label = "KIOSK-PERSIST"
  }
}
