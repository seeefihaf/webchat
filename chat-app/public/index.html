<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Beacon - Image Location Finder</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #f3f4f6;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(700px, 92vw);
      background: #171a21;
      border: 1px solid #262b37;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; }
    p { color: #c6cbda; }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    input[type="file"] {
      background: #10131a;
      border: 1px solid #30374a;
      color: #f3f4f6;
      border-radius: 8px;
      padding: 8px;
      flex: 1;
      min-width: 240px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .result {
      background: #0f131d;
      border: 1px solid #2a3244;
      border-radius: 10px;
      padding: 14px;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    a { color: #7cb7ff; }
    .error { color: #ff9090; }
    .warn { color: #f8d47a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Beacon</h1>
    <p>Upload an image and Beacon will extract GPS EXIF metadata and show its approximate location.</p>
    <form id="locate-form">
      <div class="row">
        <input id="image" name="image" type="file" accept="image/*" required />
        <button id="submit" type="submit">Find Location</button>
      </div>
    </form>
    <section id="result" class="result">Ready. Select an image to start.</section>
  </main>

  <script>
    const form = document.getElementById('locate-form');
    const imageInput = document.getElementById('image');
    const submitBtn = document.getElementById('submit');
    const resultEl = document.getElementById('result');

    function setResult(html) {
      resultEl.innerHTML = html;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const file = imageInput.files && imageInput.files[0];
      if (!file) {
        setResult('<span class="error">Please choose an image file.</span>');
        return;
      }

      submitBtn.disabled = true;
      setResult('Analyzing image metadata...');

      try {
        const formData = new FormData();
        formData.append('image', file);

        const response = await fetch('/api/locate', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || 'Unable to process this image.');
        }

        const lines = [];
        lines.push(`<strong>Coordinates:</strong> ${data.latitude}, ${data.longitude}`);
        if (data.location && data.location.displayName) {
          lines.push(`<strong>Resolved Address:</strong> ${data.location.displayName}`);
        }
        if (data.warning) {
          lines.push(`<span class="warn">${data.warning}</span>`);
        }
        lines.push(`<a href="${data.mapUrl}" target="_blank" rel="noopener noreferrer">Open in OpenStreetMap</a>`);
        setResult(lines.join('<br/>'));
      } catch (error) {
        setResult(`<span class="error">${error.message}</span>`);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
