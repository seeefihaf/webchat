name: build-kiosk-os

on:
  workflow_dispatch:
  push:
    tags:
      - 'kiosk-os-v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison cpio file flex gawk git libelf-dev libncurses-dev \
            python3 rsync unzip wget xorriso dosfstools mtools genisoimage gpg

      - name: Build image
        run: |
          chmod +x /home/runner/work/webchat/webchat/kiosk-os/scripts/build.sh
          /home/runner/work/webchat/webchat/kiosk-os/scripts/build.sh

      - name: Create release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x /home/runner/work/webchat/webchat/kiosk-os/scripts/create-release-artifacts.sh
          /home/runner/work/webchat/webchat/kiosk-os/scripts/create-release-artifacts.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-os-${{ github.ref_name }}
          path: |
            /home/runner/work/webchat/webchat/kiosk-os/release/*.img
            /home/runner/work/webchat/webchat/kiosk-os/release/*.iso
            /home/runner/work/webchat/webchat/kiosk-os/release/SHA256SUMS
            /home/runner/work/webchat/webchat/kiosk-os/release/SHA256SUMS.asc
          if-no-files-found: warn

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/kiosk-os-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /home/runner/work/webchat/webchat/kiosk-os/release/*.img
            /home/runner/work/webchat/webchat/kiosk-os/release/*.iso
            /home/runner/work/webchat/webchat/kiosk-os/release/SHA256SUMS
            /home/runner/work/webchat/webchat/kiosk-os/release/SHA256SUMS.asc
